services:
    _defaults:
        autowire: false
        autoconfigure: false

    # Controller
    Umanit\SamlBundle\Controller\RedirectionAction:
        class: Umanit\SamlBundle\Controller\RedirectionAction
        calls:
            - [setContainer, ['@Psr\Container\ContainerInterface']]
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # Services
    umanit_saml.service.configuration_service:
        class: Umanit\SamlBundle\Service\ConfigurationService
        arguments:
            - '%umanit_saml%'
    Umanit\SamlBundle\Service\ConfigurationServiceInterface: '@umanit_saml.service.configuration_service'
