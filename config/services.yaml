services:
    _defaults:
        autowire: false
        autoconfigure: false

    # Controller
    Umanit\SamlBundle\Controller\MetadataAction:
        calls:
            - [setContainer, ['@Psr\Container\ContainerInterface']]
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Umanit\SamlBundle\Controller\RedirectAction:
        calls:
            - [setContainer, ['@Psr\Container\ContainerInterface']]
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Umanit\SamlBundle\Controller\AcsAction:
        calls:
            - [setContainer, ['@Psr\Container\ContainerInterface']]
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Umanit\SamlBundle\Controller\SloAction:
        calls:
            - [setContainer, ['@Psr\Container\ContainerInterface']]
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # Services
    umanit_saml.service.configuration_service:
        class: Umanit\SamlBundle\Service\ConfigurationService
        arguments:
            - ~
    Umanit\SamlBundle\Service\ConfigurationServiceInterface: '@umanit_saml.service.configuration_service'

    umanit_saml.service.idp_metadata_service:
        class: Umanit\SamlBundle\Service\IdpMetadataService
        arguments:
            - '@Umanit\SamlBundle\Service\ConfigurationServiceInterface'
            - '@http_client'
            - '@cache.app.taggable'
    Umanit\SamlBundle\Service\IdpMetadataServiceInterface: '@umanit_saml.service.idp_metadata_service'

    umanit_saml.service.sp_metadata_service:
        class: Umanit\SamlBundle\Service\SpMetadataService
        arguments:
            - '@Umanit\SamlBundle\Service\ConfigurationServiceInterface'
            - '@router.default'
            - '@router.default'
    Umanit\SamlBundle\Service\SpMetadataServiceInterface: '@umanit_saml.service.sp_metadata_service'

    umanit_saml.service.saml_anthn_request_service:
        class: Umanit\SamlBundle\Service\SamlAuthnRequestService
        arguments:
            - '@Umanit\SamlBundle\Service\ConfigurationServiceInterface'
            - '@umanit_saml.service.idp_metadata_service'
            - '@umanit_saml.service.sp_metadata_service'
    Umanit\SamlBundle\Service\SamlAuthnRequestServiceInterface: '@umanit_saml.service.saml_anthn_request_service'

    umanit_saml.service.send_message_service:
        class: Umanit\SamlBundle\Service\SendMessageService
        arguments:
            - '@Umanit\SamlBundle\Service\ConfigurationServiceInterface'
    Umanit\SamlBundle\Service\SendMessageServiceInterface: '@umanit_saml.service.send_message_service'
